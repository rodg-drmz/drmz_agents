[project]
name = "drmz_agents"
version = "0.1.0"
description = "DRMZ-Agents using crewAI with Morpheus Chat Flow"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.105.0,<1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
# Legacy crew scripts (keep for backward compatibility)
drmz_agents = "drmz_agents.main:run"
run_crew = "drmz_agents.main:run"
train = "drmz_agents.main:train"
replay = "drmz_agents.main:replay"
test = "drmz_agents.main:test"

# CrewAI flows
guide_flow = "drmz_crewai.flows.guide_creator_flow:kickoff"
morpheus_chat = "drmz_crewai.flows.morpheus_chat_flow:kickoff"

# Enterprise deployment endpoint
morpheus_api = "drmz_crewai.flows.morpheus_chat_flow:chat_endpoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drmz_crewai", "src"]

# Updated for Enterprise Flow deployment
[tool.crewai]
type = "flow"
entry_point = "drmz_crewai.flows.morpheus_chat_flow"

# Optional: Enterprise-specific configuration
[tool.crewai.enterprise]
flow_name = "morpheus_chat_flow"
description = "Morpheus-guided Cardano onboarding and chat experience"
version = "1.0.0"
endpoints = [
    {name = "chat", function = "chat_endpoint", method = "POST"}
]

# Development dependencies (optional)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0"
]