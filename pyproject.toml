[project]
name = "drmz_agents"
version = "0.1.0"
description = "DRMZ-Agents using crewAI with Morpheus Chat Flow"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=1.6.0,<2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
# Legacy crew scripts (keep for backward compatibility)
drmz_agents = "drmz_agents.main:run"
run_crew = "drmz_agents.main:run"
train = "drmz_agents.main:train"
replay = "drmz_agents.main:replay"
test = "drmz_agents.main:test"

# Note: Old drmz_crewai CLI commands removed - use src/drmz/ flows directly

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Note: Enterprise Flow deployment entry point removed
# Use src/drmz/ flows directly for deployment
[tool.crewai]
type = "flow"
# entry_point removed - use src/drmz/ flows instead

# Development dependencies (optional)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0"
]